<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Angry Birds 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="hud">
    <div id="score-box">
      <div id="score-label">Score</div>
      <div id="score-val">0</div>
    </div>
    <div id="birds-queue"></div>
  </div>

  <div id="force-container">
    <div id="force-label">POWER</div>
    <div id="force-track"><div id="force-bar"></div></div>
  </div>

  <div id="controls-hint">
    <kbd>A</kbd> / <kbd>S</kbd> — Angulo<br>
    <kbd>ESPACIO</kbd> — Cargar / Lanzar<br>
    <kbd>R</kbd> — Reiniciar nivel
  </div>

  <div id="overlay">
    <h1>Angry Birds 3D</h1>
    <p>Derriba todas las estructuras</p>
    <button id="btn-start">JUGAR</button>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js" } }
  </script>
  <script type="module" src="main.js"></script>
</body>
</html>
